<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Honor of Kings Top Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* 🎥 فيديو الخلفية */
#bgVideo {
  position: fixed;
  top: 0;
  left: 0;
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* طبقة تغبيش */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* الهيدر */
header {
  padding: 20px;
}

h1 {
  font-size: 32px;
  color: #ffcc00;
  text-shadow: 0 0 15px #ffcc00;
}

/* input */
.input-box {
  margin: 15px auto;
  max-width: 320px;
}

.input-box input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ffcc00;
  background: rgba(0,0,0,0.6);
  color: white;
  text-align: center;
  outline: none;
}

/* الكروت */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 15px;
}

.card {
  background: rgba(0,0,0,0.6);
  border: 1px solid #ffcc00;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 0 10px #ffcc0044;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ffcc00;
}

.card h2 {
  color: #ffcc00;
  font-size: 18px;
}

.card p {
  color: #ccc;
  margin: 6px 0;
}

.btn {
  display: inline-block;
  padding: 8px 12px;
  background: #6a00ff;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.btn:hover {
  background: #ffcc00;
  color: black;
}

/* 🔥 الشريط السفلي */
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(0,0,0,0.85);
  padding: 12px 0;
  border-top: 2px solid #ffcc00;
  backdrop-filter: blur(10px);
}

.bottom-nav a {
  color: #ffcc00;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  transition: 0.3s;
}

.bottom-nav a:hover {
  color: #fff;
  transform: scale(1.1);
}
</style>
</head>

<body>

<!-- 🎥 فيديو الخلفية -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="assets/images/vidio.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<header>
  <h1>Honor of Kings Top Up</h1>

  <div class="input-box">
    <input type="text" placeholder="ادخل الـ UID الخاص بك">
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>32 Tokens</h2>
    <p>10 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>46 Tokens</h2>
    <p>15 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>160 Tokens</h2>
    <p>50 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>480 Tokens</h2>
    <p>165 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>800 Tokens</h2>
    <p>260 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>
<div class="card">
    <h2>672 Tokens</h2>
    <p>350 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>
</div>

<!-- 🔥 Bottom Navigation -->
<div class="bottom-nav">
  <a href="home.html">🏠 شحن</a>
  <a href="profit.html">💰 نقاطك</a>
  <a href="role.html">🎯 مهام</a>
  <a href="invite.html">👥 الدعوة</a>
</div>

</body>
</html>
