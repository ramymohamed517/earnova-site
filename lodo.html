<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ludo Gold Top Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  color:white;
  text-align:center;
  overflow-x:hidden;
  padding-bottom:80px;
}

/* 🎥 فيديو الخلفية */
#bgVideo{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* طبقة تغبيش */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* الهيدر */
header{
  padding:25px 15px;
}

h1{
  font-size:32px;
  color:#00ff99;
  text-shadow:0 0 15px #00ff99;
}

/* input */
.input-box{
  margin:15px auto;
  max-width:320px;
}

.input-box input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #00ff99;
  background:rgba(0,0,0,0.6);
  color:white;
  text-align:center;
  outline:none;
}

/* الكروت */
.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:15px;
}

.card{
  background:rgba(0,0,0,0.6);
  border:1px solid #00ff99;
  border-radius:12px;
  padding:12px;
  box-shadow:0 0 10px #00ff9944;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ff99;
}

.card h2{
  color:#00ff99;
  font-size:18px;
}

.card p{
  color:#ccc;
  margin:6px 0;
}

.btn{
  display:inline-block;
  padding:8px 12px;
  background:#00cc77;
  color:white;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#00ff99;
  color:black;
}

/* 🔥 الشريط السفلي */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(0,0,0,0.85);
  padding:12px 0;
  border-top:2px solid #00ff99;
  backdrop-filter:blur(10px);
}

.bottom-nav a{
  color:#00ff99;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  transition:0.3s;
}

.bottom-nav a:hover{
  color:#fff;
  transform:scale(1.1);
}
</style>
</head>

<body>

<!-- 🎥 فيديو الخلفية -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="assets/images/vidio.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<header>
  <h1>Ludo Gold Top Up</h1>

  <div class="input-box">
    <input type="text" placeholder="ادخل الـ ID الخاص بك">
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>10,000 Coins</h2>
    <p>60 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>30,000 Coins</h2>
    <p>220 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>72,000 Coins</h2>
    <p>250 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>210,000 Coins</h2>
    <p>650 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>500,000 Coins</h2>
    <p>1500 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

  <div class="card">
    <h2>1,200,000 Coins</h2>
    <p>3200 جنيه</p>
    <a class="btn" href="#">اشحن</a>
  </div>

</div>

<!-- 🔥 Bottom Navigation -->
<div class="bottom-nav">
  <a href="home.html">🏠 شحن</a>
  <a href="profit.html">💰 نقاطك</a>
  <a href="role.html">🎯 مهام</a>
  <a href="invite.html">👥 الدعوة</a>
</div>

</body>
</html>
