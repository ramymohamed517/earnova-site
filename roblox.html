<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Roblox Top Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
  color:white;
  text-align:center;
}

/* 🎥 فيديو الخلفية */
#bgVideo{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* طبقة شفافة */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:-1;
}

/* الصندوق */
.box{
  background:rgba(0,0,0,0.65);
  border:2px solid #ffffff;
  border-radius:20px;
  padding:35px 25px;
  width:90%;
  max-width:400px;
  box-shadow:0 0 25px rgba(255,255,255,0.3);
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{
    box-shadow:0 0 15px rgba(255,255,255,0.2);
  }
  to{
    box-shadow:0 0 30px rgba(255,255,255,0.6);
  }
}

.logo{
  font-size:42px;
  margin-bottom:15px;
}

h1{
  font-size:30px;
  margin-bottom:15px;
  color:#ffffff;
}

p{
  font-size:18px;
  color:#ddd;
  line-height:1.8;
}

.loading{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.loading span{
  width:12px;
  height:12px;
  background:white;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:0.2s;
}

.loading span:nth-child(3){
  animation-delay:0.4s;
}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
    opacity:0.5;
  }
  50%{
    transform:translateY(-10px);
    opacity:1;
  }
}

/* 🔥 زر الرجوع */
.btn{
  display:inline-block;
  margin-top:25px;
  padding:10px 20px;
  border-radius:10px;
  background:#ffffff;
  color:black;
  text-decoration:none;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  background:#ddd;
}
</style>
</head>

<body>

<!-- 🎥 فيديو الخلفية -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="assets/images/vidio.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="box">

  <div class="logo">🎮</div>

  <h1>Roblox Top Up</h1>

  <p>
    🚧 جاري العمل على صفحة شحن روبلوكس حالياً
    <br><br>
    سيتم إضافة الشحن قريباً 🔥
  </p>

  <div class="loading">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <a class="btn" href="home.html">⬅ الرجوع للرئيسية</a>

</div>

</body>
</html>
